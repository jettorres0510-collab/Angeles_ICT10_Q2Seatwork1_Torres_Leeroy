<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Club Checker</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            background: #f3f5f8;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            color: #26364a;
        }

        .checker {
            width: 100%;
            max-width: 420px;
            margin: auto;
            padding: 32px;
            background: #ffffff;
            border: 1px solid #e1e6ed;
            border-radius: 8px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.7px;
            text-align: center;
            margin-bottom: 8px;
            color: #243b59;
        }

        .subtitle {
            font-size: 13px;
            color: #7b8492;
            text-align: center;
            margin-bottom: 28px;
        }

        .section-line {
            border: 0;
            border-top: 1px solid #e7ebf0;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #354256;
        }

        .form-control {
            padding: 12px;
            margin-bottom: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            border: 1px solid #d8dee7;
            border-radius: 5px;
            box-shadow: none;
        }

        .form-control:focus {
            border-color: #49688f;
            box-shadow: none;
        }

        .enter-btn {
            width: 100%;
            padding: 12px;
            background: #304b70;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
        }

        .result {
            min-height: 58px;
            margin-top: 20px;
            padding: 14px;
            background: #f0f5fb;
            border: 1px solid #e0e9f4;
            border-radius: 5px;
            color: #435c7b;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        footer {
            padding-top: 18px;
            color: #8a93a0;
            font-size: 11px;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .checker {
                padding: 26px 22px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <main class="checker">
        <h1>ICT Club Checker</h1>
        <p class="subtitle">Candidate Verification System</p>

        <hr class="section-line">

        <label for="first_name">First Name</label>
        <input
            type="text"
            id="first_name"
            class="form-control"
            placeholder="Enter first name"
            aria-label="First Name"
        >

        <label for="last_name">Last Name</label>
        <input
            type="text"
            id="last_name"
            class="form-control"
            placeholder="Enter last name"
            aria-label="Last Name"
        >

        <button
            type="button"
            class="btn enter-btn"
            py-click="verify_candidate"
        >
            Check Membership
        </button>

        <div class="result" id="result" aria-live="polite">
            Enter your name to check your membership.
        </div>
    </main>

    <footer>
        © 2026 ICT Club · Seatwork 1 · 2nd Quarter
    </footer>

    <py-script src="main.py"></py-script>
</body>
</html>
